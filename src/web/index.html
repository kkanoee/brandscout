<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrandScout</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">◎</span> BrandScout
      <span class="sub">multi-source brand scouting</span>
    </div>
    <nav>
      <button id="tab-launch" class="tab active">Launch a Run</button>
      <button id="tab-reports" class="tab">Reports</button>
    </nav>
    <div id="modeBadge" class="mode-badge" title="Execution mode"></div>
  </header>

  <main>
    <!-- SCREEN 1: Launch a Run -->
    <section id="screen-launch" class="screen">
      <div class="col">
        <h2>Brand</h2>
        <div class="row">
          <select id="brandSelect"></select>
          <button id="seedBtn" class="ghost" title="Create the demo Brand">Seed demo</button>
        </div>
        <div class="row">
          <input id="newBrandName" type="text" placeholder="New Brand…" />
          <button id="addBrandBtn">Add</button>
        </div>
        <div class="row">
          <input id="officialHandles" type="text" placeholder="Official account(s), e.g. ChartAcademyx"
                 title="Comma-separated brand-owned handles. Their posts are shown but marked 'official' and excluded from confidence corroboration." />
          <button id="saveOfficialBtn" class="ghost">Save official</button>
        </div>

        <h2>Collection sources</h2>
        <p class="hint">Seed Source = a known place (collect everything). Keyword Query = a term whose mentions are collected. The tool never guesses what to look for.</p>
        <table id="targetsTable" class="targets">
          <thead><tr><th>Mode</th><th>Connector</th><th>Value</th><th></th></tr></thead>
          <tbody></tbody>
        </table>

        <div class="add-target">
          <select id="tMode">
            <option value="seed_source">Seed Source</option>
            <option value="keyword_query">Keyword Query</option>
          </select>
          <select id="tConnector">
            <option value="reddit">Reddit</option>
            <option value="youtube">YouTube</option>
            <option value="x">X / Twitter</option>
          </select>
          <input id="tValue" type="text" placeholder="subreddit / channel / keyword / @handle" />
          <button id="addTargetBtn">+ Add</button>
        </div>
        <div id="targetErr" class="err"></div>

        <div class="launch">
          <button id="launchBtn" class="primary">▶ Launch the Run</button>
          <span id="envelope" class="hint"></span>
        </div>
      </div>

      <div class="col">
        <h2>Run log</h2>
        <pre id="runLog" class="log">No run in progress.</pre>
      </div>
    </section>

    <!-- SCREEN 2: Reports -->
    <section id="screen-reports" class="screen hidden">
      <div class="col runs">
        <h2>Runs</h2>
        <ul id="runsList" class="runs-list"></ul>
      </div>
      <div class="col report">
        <div id="reportView"><p class="hint">Select a Run.</p></div>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
